name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - run: dotnet test Isthifa.AspNetCore.ExceptionHandling.sln --configuration Release
      - run: dotnet pack src/Isthifa.AspNetCore.ExceptionHandling/Isthifa.AspNetCore.ExceptionHandling.csproj --configuration Release --no-restore
